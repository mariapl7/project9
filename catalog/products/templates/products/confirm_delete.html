<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Подтверждение удаления</title>
</head>
<body>
    <h1>Подтверждение удаления продукта</h1>
    <p>Вы уверены, что хотите удалить продукт "{{ product.name }}"?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit">Удалить</button>
    </form>
    <a href="{% url 'product_list' %}">Отмена</a>
</body>
</html>
